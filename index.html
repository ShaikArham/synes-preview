<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SYNES · Workflow Operations Lab</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#202237;background:#f7f7fb}*{box-sizing:border-box}body{margin:0}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:flex;min-height:100vh}.side{width:232px;flex:none;background:#fff;border-right:1px solid #e7e5ef;padding:24px 12px}.brand{font-weight:800;font-size:20px;letter-spacing:-.05em;padding:4px 12px 26px}.brand b{color:#6c4fd3}.section{color:#85859a;font-size:11px;font-weight:800;letter-spacing:.13em;margin:20px 12px 10px}.nav{width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:12px;color:#57576c;margin:2px 0}.nav[aria-current=page]{background:#f0ecfc;color:#5d3dbf;font-weight:700}.nav:hover{background:#f7f5ff}.main{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid #e7e5ef;display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px}.crumb{font-size:13px;color:#70738a}.tag{font-size:11px;border:1px solid #d9d2f4;background:#f7f4ff;color:#6548b7;padding:6px 10px;border-radius:99px}.content{padding:34px;max-width:1400px;margin:auto}h1{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}p{color:#70738a;line-height:1.55}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:28px 0}.card,.workspace{border:1px solid #e7e5ef;background:#fff;border-radius:12px;padding:22px}.card h3{margin:0 0 8px;font-size:15px}.card p{font-size:13px;margin:0}.workspace{min-height:330px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #eeeaf4;padding-bottom:18px}.muted{font-size:12px;color:#88889c}.nodes{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;padding:55px 0}.node{border:1px solid #ddd8ec;border-radius:11px;padding:17px;min-width:140px;background:#fff;box-shadow:0 8px 20px #2e22520a}.node strong{display:block;font-size:13px}.node small{color:#8b899e}.arrow{color:#a99cda}.button{background:#6c4fd3;color:white;border:0;border-radius:8px;padding:10px 14px}.button:focus-visible,.nav:focus-visible{outline:3px solid #b4a3f3;outline-offset:2px}.notice{border-left:3px solid #6c4fd3;background:#f4f0ff;padding:13px 16px;margin-top:22px;color:#5d4c83;font-size:13px}.menu{display:none}@media(max-width:800px){.side{width:190px}.cards{grid-template-columns:1fr}.content{padding:20px}.top{padding:0 20px}}@media(max-width:600px){.side{display:none;position:fixed;z-index:5;top:70px;bottom:0;box-shadow:10px 10px 30px #0002}.side.open{display:block}.menu{display:inline-block;border:1px solid #e7e5ef;background:white;padding:8px;border-radius:8px}.top{justify-content:flex-start}.tag{margin-left:auto}.nodes{gap:8px}.node{min-width:110px;padding:12px}.arrow{display:none}}
</style></head><body><div class="app"><aside class="side" id="sidebar"><div class="brand">SYNES <b>✳</b></div><div class="section">WORKSPACE</div><nav id="nav" aria-label="Primary navigation"></nav><div class="section">PROJECT</div><a class="nav" style="display:block" href="/">Legacy incident lab ↗</a></aside><div class="main"><header class="top"><button class="menu" id="menu" aria-expanded="false" aria-controls="sidebar">☰ Menu</button><span class="crumb" id="crumb">Workspace / Home</span><span class="tag">Independent · Synthetic demo</span></header><main class="content" id="view"></main></div></div>
<script>
const pages={Home:{title:'Your workspace',desc:'Explore workflow operations, monitoring and governance in one connected lab.',cards:[['Workflow Studio','Inspect a connected workflow and its execution stages.'],['Monitoring','Understand health, usage and operational signals.'],['Governance','Review scoped permissions and human approvals.']]},Workflows:{title:'Workflow Studio',desc:'An early interactive workspace shell for a synthetic survey-summary workflow.'},Monitoring:{title:'Monitoring',desc:'Execution health, access mapping, value and AI usage will be derived from simulated run records.'},Access:{title:'Access & governance',desc:'Space permissions, connector scopes and time-limited access reviews are planned.'},Decisions:{title:'Decision Studio',desc:'Evaluate build, buy and borrow approaches as an additional strategy exercise.'},Activity:{title:'Activity',desc:'A unified audit trail will connect workflow actions, approvals and publishing.'},About:{title:'About the builder',desc:'The experience and motivation behind SYNES.'}};
const steps=[{name:'Survey received',kind:'Trigger',detail:'A fictional survey submission enters the workflow. No external service is contacted.'},{name:'Validate input',kind:'Processing',detail:'Checks the synthetic survey ID and response text before the next step.'},{name:'Summarise',kind:'AI step (mock)',detail:'Uses a deterministic placeholder summary. No AI model or token billing is involved.'},{name:'Send review',kind:'Approval',detail:'Represents a human review handoff. This phase does not send notifications.'}];let selected=0;let runs=[];let sequence=0;
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),crumb=document.querySelector('#crumb'),side=document.querySelector('#sidebar'),menu=document.querySelector('#menu');
function render(name){if(!pages[name])name='Home';history.replaceState(null,'','#'+name.toLowerCase());crumb.textContent='Workspace / '+name;nav.innerHTML=Object.keys(pages).map(n=>'<button class="nav" data-page="'+n+'" '+(n===name?'aria-current="page"':'')+'>'+n+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));const p=pages[name];let body='<h1>'+p.title+'</h1><p>'+p.desc+'</p>';if(name==='Home')body+='<div class="cards">'+p.cards.map(c=>'<article class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></article>').join('')+'</div>';if(name==='Workflows')body+='<section class="workspace"><div class="toolbar"><div><strong>Survey summary agent</strong><div class="muted">Draft · Synthetic workflow</div></div><button class="button" id="run">Simulate run</button></div><div class="nodes">'+steps.map((s,i)=>'<button class="node" data-step="'+i+'" aria-pressed="'+(selected===i)+'" style="'+(selected===i?'border-color:#6c4fd3;background:#f7f4ff':'')+'"><strong>'+s.name+'</strong><small>'+s.kind+'</small></button>').join('<span class="arrow">→</span>')+'</div><div class="card" id="inspector"><h3>Step inspector · '+steps[selected].name+'</h3><p>'+steps[selected].detail+'</p></div><div class="card" style="margin-top:16px"><h3>Execution history</h3><div id="history">'+(runs.length?runs.map(r=>'<p><strong>'+r.id+'</strong> · '+r.status+' · '+r.steps+' steps · deterministic synthetic execution</p>').join(''):'<p>No simulations yet. Run the workflow to create an example execution record.</p>')+'</div></div></section>';else if(name==='About')body+='<div class="cards"><article class="card"><h3>Shaik Arham Saquib</h3><p>Dublin-based MSc Computing (Data Analytics) graduate with 2.5+ years of enterprise BI operations experience at Hitachi Digital Services.</p></article><article class="card"><h3>What I bring</h3><p>SQL, Python, Oracle reporting systems, ETL monitoring, troubleshooting and evidence-led operational investigation.</p></article><article class="card"><h3>Why SYNES</h3><p>I built this independent project to learn how AI-assisted workflows can be designed, monitored and governed responsibly. I am interested in early-career opportunities at Tines.</p></article></div><p><a href="https://github.com/ShaikArham" target="_blank" rel="noopener noreferrer">GitHub portfolio ↗</a></p>';else if(name!=='Home')body+='<section class="workspace"><strong>Planned module</strong><p>This screen is a navigation placeholder. Data, controls and persistence are not implemented.</p></section>';body+='<div class="notice">SYNES is an independent portfolio prototype inspired by workflow-operations concepts. Not affiliated with Tines. All scenarios are synthetic.</div>';view.innerHTML=body;if(name==='Workflows'){view.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.step);render('Workflows')}));view.querySelector('#run').addEventListener('click',()=>{sequence++;runs.unshift({id:'RUN-'+String(sequence).padStart(3,'0'),status:'Completed',steps:steps.length});render('Workflows')})}side.classList.remove('open');menu.setAttribute('aria-expanded','false')}
menu.addEventListener('click',()=>{const open=side.classList.toggle('open');menu.setAttribute('aria-expanded',String(open))});render(Object.keys(pages).find(n=>n.toLowerCase()===location.hash.slice(1))||'Home');
</script></body></html>
