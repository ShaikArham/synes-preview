<script>
const pages={Home:{title:'Your workspace',desc:'Explore workflow operations, monitoring and governance in one connected lab.',cards:[['Workflow Studio','Inspect a connected workflow and its execution stages.'],['Monitoring','Understand health, usage and operational signals.'],['Governance','Review scoped permissions and human approvals.']]},Workflows:{title:'Workflow Studio',desc:'An early interactive workspace shell for a synthetic survey-summary workflow.'},Monitoring:{title:'Monitoring',desc:'Execution health, access mapping, value and AI usage will be derived from simulated run records.'},Access:{title:'Access & governance',desc:'Space permissions, connector scopes and time-limited access reviews are planned.'},Decisions:{title:'Decision Studio',desc:'Evaluate build, buy and borrow approaches as an additional strategy exercise.'},Activity:{title:'Activity',desc:'A unified audit trail will connect workflow actions, approvals and publishing.'},About:{title:'About the builder',desc:'The experience and motivation behind SYNES.'}};
const steps=[{name:'Survey received',kind:'Trigger',detail:'A fictional survey submission enters the workflow. No external service is contacted.'},{name:'Validate input',kind:'Processing',detail:'Checks the synthetic survey ID and response text before the next step.'},{name:'Summarise',kind:'AI step (mock)',detail:'Uses a deterministic placeholder summary. No AI model or token billing is involved.'},{name:'Send review',kind:'Approval',detail:'Represents a human review handoff. This phase does not send notifications.'}];let selected=0;let runs=[];let sequence=0;let scenario='baseline';const scenarios={baseline:{label:'Normal operation',volume:100,retries:0,tokens:1200,latency:340},spike:{label:'Usage spike',volume:100,retries:2,tokens:3600,latency:790},validation:{label:'Invalid survey',volume:100,retries:0,tokens:0,latency:75}};function simulate(){const s=scenarios[scenario];sequence++;const failed=scenario==='validation';const record={id:'RUN-'+String(sequence).padStart(3,'0'),scenario,label:s.label,status:failed?'Failed':'Completed',volume:s.volume,retries:s.retries,tokens:s.tokens,latency:s.latency,estimatedCost:Number((s.tokens*0.000002).toFixed(4)),steps:steps.map((step,i)=>({name:step.name,status:failed&&i===1?'Failed':failed&&i>1?'Skipped':'Completed',durationMs:Math.round(s.latency/(i+1))}))};runs.unshift(record);if(runs.length>100)runs.length=100;logEvent('Workflow simulated',record.id+' · '+record.label+' · '+record.status);return record}function summary(){return runs.reduce((a,r)=>({count:a.count+1,success:a.success+(r.status==='Completed'?1:0),tokens:a.tokens+r.tokens,cost:a.cost+r.estimatedCost,retries:a.retries+r.retries}),{count:0,success:0,tokens:0,cost:0,retries:0})}
let requests=[],audit=[],requestSeq=0,eventSeq=0,clockDay=0;let publish={status:'Draft',version:1,requestedDay:null};let decisions=[];let decisionSeq=0;const demoStart='2026-11-12';function logEvent(action,detail){audit.unshift({id:'EVT-'+String(++eventSeq).padStart(3,'0'),day:clockDay,action,detail});if(audit.length>200)audit.length=200}function requestAccess(role,connector,days){if(!['Viewer','Space editor'].includes(role)||!['None','Slack: use only'].includes(connector)||![30,90].includes(days))return null;requestSeq++;const req={id:'ACC-'+String(requestSeq).padStart(3,'0'),role,connector,days,createdDay:clockDay,status:'Pending',approvedDay:null};requests.unshift(req);logEvent('Access requested',req.id+' · '+role+' · '+connector+' · '+days+' days');return req}function decideAccess(id,approved){const req=requests.find(r=>r.id===id);if(!req||req.status!=='Pending')return false;req.status=approved?'Active':'Denied';req.approvedDay=approved?clockDay:null;logEvent(approved?'Access approved':'Access denied',req.id+' · '+req.role+' · '+req.connector);return true}function advanceDay(days){if(!Number.isInteger(days)||days<=0||days>365)return false;clockDay+=days;for(const req of requests){if(req.status==='Active'&&clockDay>=req.approvedDay+req.days){req.status='Expired';logEvent('Access expired',req.id+' · grant automatically expired in simulated timeline')}}return true}function requestPublish(){if(publish.status!=='Draft')return false;publish.status='Pending approval';publish.requestedDay=clockDay;logEvent('Publish requested','Workflow v'+publish.version+' awaiting human approval');return true}function decidePublish(approved){if(publish.status!=='Pending approval')return false;publish.status=approved?'Published':'Draft';logEvent(approved?'Workflow published':'Publish rejected','Workflow v'+publish.version+' · '+(approved?'approved':'returned to draft'));return true}function reviseDraft(){if(publish.status!=='Published')return false;publish.version++;publish.status='Draft';logEvent('New draft created','Workflow v'+publish.version);return true}function recordDecision(option,reason){if(!['Build','Buy','Borrow'].includes(option)||!['Speed to delivery','Control and customization','Maintenance cost'].includes(reason))return null;const d={id:'DEC-'+String(++decisionSeq).padStart(3,'0'),option,reason,day:clockDay};decisions.unshift(d);if(decisions.length>50)decisions.length=50;logEvent('Strategy decision recorded',d.id+' · '+option+' · '+reason);return d}function resetDemo(){decisions=[];decisionSeq=0;publish={status:'Draft',version:1,requestedDay:null};runs=[];sequence=0;scenario='baseline';selected=0;requests=[];audit=[];requestSeq=0;eventSeq=0;clockDay=0;return true}function escapeText(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}
const STORE_KEY='synes-demo-v1';let storageNotice='';function saveDemo(){try{sessionStorage.setItem(STORE_KEY,JSON.stringify({schema:1,runs,sequence,scenario,requests,audit,requestSeq,eventSeq,clockDay,publish,decisions,decisionSeq}));return true}catch(_){storageNotice='Browser session storage is unavailable. Your demo will work until this page is refreshed.';return false}}function restoreDemo(){try{const raw=sessionStorage.getItem(STORE_KEY);if(!raw)return false;if(raw.length>150000){sessionStorage.removeItem(STORE_KEY);storageNotice='Oversized saved demo data was cleared for safety.';return false}const s=JSON.parse(raw);if(s.schema!==1||!Array.isArray(s.runs)||s.runs.length>100||!Array.isArray(s.requests)||s.requests.length>200||!Array.isArray(s.audit)||s.audit.length>200||!['baseline','spike','validation'].includes(s.scenario)||!Number.isSafeInteger(s.sequence)||s.sequence<0||!Number.isSafeInteger(s.requestSeq)||s.requestSeq<0||!Number.isSafeInteger(s.eventSeq)||s.eventSeq<0||!Number.isSafeInteger(s.clockDay)||s.clockDay<0||s.clockDay>100000||!s.publish||!['Draft','Pending approval','Published'].includes(s.publish.status)||!Number.isSafeInteger(s.publish.version)||s.publish.version<1)return false;const validRun=r=>r&&typeof r.id==='string'&&/^RUN-\d{3,}$/.test(r.id)&&['baseline','spike','validation'].includes(r.scenario)&&['Completed','Failed'].includes(r.status)&&typeof r.label==='string'&&r.label===scenarios[r.scenario].label&&Array.isArray(r.steps)&&r.steps.length===4&&r.steps.every((step,i)=>step&&step.name===steps[i].name&&['Completed','Failed','Skipped'].includes(step.status)&&Number.isFinite(step.durationMs)&&step.durationMs>=0)&&Number.isFinite(r.tokens)&&r.tokens>=0&&Number.isFinite(r.retries)&&r.retries>=0;const validRequest=r=>r&&typeof r.id==='string'&&/^ACC-\d{3,}$/.test(r.id)&&['Viewer','Space editor'].includes(r.role)&&['None','Slack: use only'].includes(r.connector)&&[30,90].includes(r.days)&&['Pending','Active','Denied','Expired'].includes(r.status)&&Number.isSafeInteger(r.createdDay)&&r.createdDay>=0&&(r.approvedDay===null||Number.isSafeInteger(r.approvedDay));const validEvent=e=>e&&typeof e.id==='string'&&/^EVT-\d{3,}$/.test(e.id)&&typeof e.action==='string'&&e.action.length<=100&&typeof e.detail==='string'&&e.detail.length<=500&&Number.isSafeInteger(e.day)&&e.day>=0;if(!s.runs.every(validRun)||!s.requests.every(validRequest)||!s.audit.every(validEvent)||!Array.isArray(s.decisions)||s.decisions.length>50||!Number.isSafeInteger(s.decisionSeq)||s.decisionSeq<0||!s.decisions.every(d=>d&&/^DEC-\d{3,}$/.test(d.id)&&['Build','Buy','Borrow'].includes(d.option)&&['Speed to delivery','Control and customization','Maintenance cost'].includes(d.reason)&&Number.isSafeInteger(d.day)&&d.day>=0))return false;runs=s.runs;sequence=s.sequence;scenario=s.scenario;requests=s.requests;audit=s.audit;requestSeq=s.requestSeq;eventSeq=s.eventSeq;clockDay=s.clockDay;decisions=s.decisions;decisionSeq=s.decisionSeq;publish={status:s.publish.status,version:s.publish.version,requestedDay:Number.isSafeInteger(s.publish.requestedDay)?s.publish.requestedDay:null};return true}catch(_){storageNotice='Unreadable saved demo data was ignored. A fresh session has started.';try{sessionStorage.removeItem(STORE_KEY)}catch(__){}return false}}function consumeEditorHandoff(){try{const raw=sessionStorage.getItem('synes-editor-handoff-v1');if(!raw)return false;sessionStorage.removeItem('synes-editor-handoff-v1');if(raw.length>25000)return false;const x=JSON.parse(raw);if(x.schema!==1||!/^ED-[a-z0-9]+$/.test(x.id)||!['Completed','Failed'].includes(x.status)||!Array.isArray(x.steps)||!x.steps.length||x.steps.length>80||!x.steps.every(n=>n&&typeof n.id==='string'&&n.id.length<100&&typeof n.label==='string'&&n.label.length<=100&&['Completed','Failed','Skipped'].includes(n.status)))return false;const kind=x.failure&&['401','422','429'].includes(x.failure.code)?x.failure.code:null;const mapped=kind==='422'?'validation':kind==='429'?'spike':kind==='401'?'validation':'baseline';const template=scenarios[mapped];sequence++;const record={id:'RUN-'+String(sequence).padStart(3,'0'),scenario:mapped,label:template.label,status:x.status,volume:template.volume,retries:template.retries,tokens:template.tokens,latency:template.latency,estimatedCost:Number((template.tokens*0.000002).toFixed(4)),steps:steps.map((step,i)=>({name:step.name,status:x.status==='Failed'&&i===1?'Failed':x.status==='Failed'&&i>1?'Skipped':'Completed',durationMs:Math.round(template.latency/(i+1))}))};runs.unshift(record);if(runs.length>100)runs.length=100;logEvent('Editor graph simulated',record.id+' · '+x.steps.length+' nodes · '+x.status+(kind?' · '+kind:''));storageNotice='Visual Editor execution '+x.id+' imported as '+record.id+'. Monitoring uses the existing four-stage lab summary; detailed editor nodes remain in the editor handoff.';return true}catch(_){return false}}
function clearSavedDemo(){try{sessionStorage.removeItem(STORE_KEY)}catch(_){}}
const nav=document.querySelector('#nav'),view=document.querySelector('#view'),crumb=document.querySelector('#crumb'),side=document.querySelector('#sidebar'),menu=document.querySelector('#menu');
function render(name){saveDemo();if(!pages[name])name='Home';if(location.hash!=='#'+name.toLowerCase())history.pushState(null,'','#'+name.toLowerCase());crumb.textContent='Workspace / '+name;nav.innerHTML=Object.keys(pages).map(n=>'<button class="nav" data-page="'+n+'" '+(n===name?'aria-current="page"':'')+'>'+n+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>render(b.dataset.page)));const p=pages[name];let body='<h1>'+p.title+'</h1><p>'+p.desc+'</p>';if(name==='Home')body+='<div class="cards">'+p.cards.map(c=>'<article class="card"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></article>').join('')+'</div><section class="workspace" style="min-height:0"><h3>Demo controls</h3><p>Synthetic data is saved only for this browser tab session, including across reloads. Close the tab to end the session. Clear simulated runs, access requests, strategy decisions and audit events to start a fresh review.</p><button class="button" id="reset-demo">Reset demo</button><p id="reset-feedback" role="status" aria-live="polite"></p></section>';if(name==='Workflows')body+='<section class="workspace"><div class="toolbar"><div><strong>Survey summary agent</strong><div class="muted">'+escapeText(publish.status)+' · v'+publish.version+' · Synthetic workflow</div></div><div><label for="scenario">Scenario </label><select id="scenario"><option value="baseline">Normal operation</option><option value="spike">Usage spike</option><option value="validation">Invalid survey</option></select> <button class="button" id="run">Simulate run</button></div></div><div class="card" style="margin-top:16px"><h3>Publishing approval</h3><p>Status: <strong>'+escapeText(publish.status)+'</strong>. This is a simulated human-gated decision, not a live deployment.</p>'+(publish.status==='Draft'?'<button class="button" id="request-publish">Request publish approval</button>':publish.status==='Pending approval'?'<button class="button" id="approve-publish">Approve publish</button> <button id="reject-publish">Reject</button>':'<button class="button" id="revise-draft">Create next draft</button>')+'</div><div class="nodes">'+steps.map((s,i)=>'<button class="node" data-step="'+i+'" aria-pressed="'+(selected===i)+'" style="'+(selected===i?'border-color:#6c4fd3;background:#f7f4ff':'')+'"><strong>'+s.name+'</strong><small>'+s.kind+'</small></button>').join('<span class="arrow">→</span>')+'</div><div class="card" id="inspector"><h3>Step inspector · '+steps[selected].name+'</h3><p>'+steps[selected].detail+'</p></div><div class="card" style="margin-top:16px"><h3>Execution history</h3><div id="history">'+(runs.length?runs.map(r=>'<p><strong>'+r.id+'</strong> · '+escapeText(r.label)+' · '+r.status+' · '+r.steps.length+' steps · '+r.tokens+' tokens (simulated) · '+r.retries+' retries</p>').join(''):'<p>No simulations yet. Run the workflow to create an example execution record.</p>')+'</div></div></section>';else if(name==='Monitoring'){const s=summary();body+='<div class="cards"><article class="card"><h3>Runs</h3><h1>'+s.count+'</h1><p>Local session</p></article><article class="card"><h3>Success rate</h3><h1>'+(s.count?(100*s.success/s.count).toFixed(1)+'%':'—')+'</h1><p>From simulated runs</p></article><article class="card"><h3>AI tokens (simulated)</h3><h1>'+s.tokens+'</h1><p>Estimated cost €'+s.cost.toFixed(4)+'</p></article></div><section class="workspace"><h3>Execution evidence</h3><p>Retries: '+s.retries+' · No real model calls or external services</p>'+(runs.length?runs.map(r=>'<div class="card" style="margin:10px 0"><strong>'+r.id+' · '+escapeText(r.label)+'</strong><p>'+r.status+' · '+r.tokens+' synthetic tokens · '+r.retries+' retries · '+r.latency+'ms illustrative latency</p><details><summary>Inspect step results</summary>'+r.steps.map(x=>'<p>'+escapeText(x.name)+' · '+x.status+' · '+x.durationMs+'ms</p>').join('')+'</details></div>').join(''):'<p>No runs yet. Open Workflows and simulate a scenario to populate Monitoring.</p>')+'</section>'}else if(name==='Decisions')body+='<section class="workspace"><h3>Build, buy or borrow</h3><p>Record a synthetic decision about how to deliver a survey-summary capability. This is a learning exercise, not a real procurement recommendation.</p><form id="decision-form"><label>Approach <select name="option"><option>Build</option><option>Buy</option><option>Borrow</option></select></label> <label>Primary consideration <select name="reason"><option>Speed to delivery</option><option>Control and customization</option><option>Maintenance cost</option></select></label> <button class="button" type="submit">Record decision</button></form><h3>Decision history</h3>'+(decisions.length?decisions.map(d=>'<div class="card" style="margin:10px 0"><strong>'+d.id+' · '+escapeText(d.option)+'</strong><p>'+escapeText(d.reason)+' · Demo day '+d.day+'</p></div>').join(''):'<p>No strategy decisions recorded yet.</p>')+'</section>';else if(name==='Access')body+='<div class="cards"><article class="card"><h3>Active grants</h3><h1>'+requests.filter(r=>r.status==='Active').length+'</h1><p>Approved and not expired</p></article><article class="card"><h3>Pending review</h3><h1>'+requests.filter(r=>r.status==='Pending').length+'</h1><p>Human decision required</p></article><article class="card"><h3>Simulated day</h3><h1>'+clockDay+'</h1><p>Relative to '+demoStart+'</p></article></div><section class="workspace"><h3>Request temporary access</h3><p>Grant only the permissions required for a synthetic marketing contractor. Every request requires an explicit reviewer decision.</p><form id="access-form"><label>Workspace role <select name="role"><option value="Viewer">Viewer</option><option value="Space editor">Space editor</option></select></label> <label>Connector scope <select name="connector"><option value="None">None</option><option value="Slack: use only">Slack: use only</option></select></label> <label>Duration <select name="days"><option value="30">30 days</option><option value="90">90 days</option></select></label> <button class="button" type="submit">Request approval</button></form><div style="margin-top:20px"><button class="button" id="advance">Advance demo by 30 days</button></div></section><section class="workspace" style="margin-top:16px"><h3>Access review queue</h3>'+(requests.length?requests.map(r=>'<div class="card" style="margin:10px 0"><strong>'+r.id+' · '+r.status+'</strong><p>'+escapeText(r.role)+' · '+escapeText(r.connector)+' · '+r.days+' days</p>'+(r.status==='Pending'?'<button class="button" data-approve="'+r.id+'">Approve</button> <button data-deny="'+r.id+'">Deny</button>':'')+'</div>').join(''):'<p>No access requests. Submit one above to start a review.</p>')+'</section>';else if(name==='Activity')body+='<section class="workspace"><h3>Session audit events</h3><p>Local, synthetic event history. Closing the tab ends this session; Reset demo clears it sooner.</p>'+(audit.length?audit.map(e=>'<div class="card" style="margin:10px 0"><strong>'+e.id+' · '+escapeText(e.action)+'</strong><p>Demo day '+e.day+' · '+escapeText(e.detail)+'</p></div>').join(''):'<p>No events yet. Create and review an access request to generate audit evidence.</p>')+'</section>';else if(name==='About')body+='<div class="cards"><article class="card"><h3>Shaik Arham Saquib</h3><p>Dublin-based MSc Computing (Data Analytics) graduate with 2.5+ years of enterprise BI operations experience at Hitachi Digital Services.</p></article><article class="card"><h3>What I bring</h3><p>SQL, Python, Oracle reporting systems, ETL monitoring, troubleshooting and evidence-led operational investigation.</p></article><article class="card"><h3>Why SYNES</h3><p>I built this independent project to learn how AI-assisted workflows can be designed, monitored and governed responsibly. I am interested in early-career opportunities at Tines.</p></article></div><p><a href="https://github.com/ShaikArham" target="_blank" rel="noopener noreferrer">GitHub portfolio ↗</a></p>';else if(name!=='Home')body+='<section class="workspace"><strong>Planned module</strong><p>This screen is a navigation placeholder. Data, controls and persistence are not implemented.</p></section>';body+='<div class="notice">SYNES is an independent portfolio prototype inspired by workflow-operations concepts. Not affiliated with Tines. All scenarios are synthetic.</div>';if(storageNotice)body+='<p role="status" class="notice">'+escapeText(storageNotice)+'</p>';view.innerHTML=body;if(name==='Home'){view.querySelector('#reset-demo').addEventListener('click',()=>{if(window.confirm('Clear all synthetic runs, approvals and activity from this tab?')){resetDemo();clearSavedDemo();render('Home');view.querySelector('#reset-feedback').textContent='Demo reset. All session records cleared.'}})}if(name==='Workflows'){const publishActions=[['#request-publish',()=>requestPublish()],['#approve-publish',()=>decidePublish(true)],['#reject-publish',()=>decidePublish(false)],['#revise-draft',()=>reviseDraft()]];for(const [selector,action] of publishActions){const b=view.querySelector(selector);if(b)b.addEventListener('click',()=>{action();render('Workflows')})}view.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.step);render('Workflows')}));view.querySelector('#scenario').value=scenario;view.querySelector('#scenario').addEventListener('change',e=>scenario=e.target.value);view.querySelector('#run').addEventListener('click',()=>{simulate();render('Workflows')})}if(name==='Decisions'){view.querySelector('#decision-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);recordDecision(data.get('option'),data.get('reason'));render('Decisions')})}if(name==='Access'){view.querySelector('#access-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);requestAccess(data.get('role'),data.get('connector'),Number(data.get('days')));render('Access')});view.querySelector('#advance').addEventListener('click',()=>{advanceDay(30);render('Access')});view.querySelectorAll('[data-approve]').forEach(b=>b.addEventListener('click',()=>{decideAccess(b.dataset.approve,true);render('Access')}));view.querySelectorAll('[data-deny]').forEach(b=>b.addEventListener('click',()=>{decideAccess(b.dataset.deny,false);render('Access')}))}side.classList.remove('open');menu.setAttribute('aria-expanded','false')}
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();view.focus()});window.addEventListener('hashchange',()=>render(Object.keys(pages).find(n=>n.toLowerCase()===location.hash.slice(1))||'Home'));menu.addEventListener('click',()=>{const open=side.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));if(open){const first=side.querySelector('a,button');if(first)first.focus()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){side.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.focus()}else if(e.key==='Tab'&&side.classList.contains('open')&&matchMedia('(max-width:600px)').matches){const focusable=[...side.querySelectorAll('a[href],button:not([disabled])')];if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});window.addEventListener('resize',()=>{if(innerWidth>600&&side.classList.contains('open')){side.classList.remove('open');menu.setAttribute('aria-expanded','false')}});const recovered=restoreDemo();consumeEditorHandoff();if(!recovered){try{if(sessionStorage.getItem(STORE_KEY)){clearSavedDemo();storageNotice='Invalid or outdated saved demo data was cleared. A fresh session has started.'}}catch(_){}}render(Object.keys(pages).find(n=>n.toLowerCase()===location.hash.slice(1))||'Home');
</script></body></html>
