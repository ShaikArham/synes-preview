der><main class="content" id="view" tabindex="-1"></main></div></div>
<script>
const pages={Home:{title:'Your workspace',desc:'Explore workflow operations, monitoring and governance in one connected lab.',cards:[['Workflow Studio','Inspect a connected workflow and its execution stages.'],['Monitoring','Understand health, usage and operational signals.'],['Governance','Review scoped permissions and human approvals.']]},Incidents:{title:'Incident Investigation',desc:'Investigate synthetic 401, 422 and 429 failures with evidence and human-gated recovery.'},Workflows:{title:'Workflow Studio',desc:'An early interactive workspace shell for a synthetic survey-summary workflow.'},Monitoring:{title:'Monitoring',desc:'Review synthetic execution health, failed runs, linked investigations and simulated AI usage.'},Access:{title:'Access & governance',desc:'Request, review, revoke and expire synthetic time-limited access grants.'},Decisions:{title:'Decision Studio',desc:'Evaluate build, buy and borrow approaches as an additional strategy exercise.'},Activity:{title:'Activity',desc:'Search the synthetic audit timeline across runs, incidents, approvals and governance.'},About:{title:'About the builder',desc:'The experience and motivation behind SYNES.'}};
const steps=[{name:'Survey received',kind:'Trigger',detail:'A fictional survey submission enters the workflow. No external service is contacted.'},{name:'Validate input',kind:'Processing',detail:'Checks the synthetic survey ID and response text before the next step.'},{name:'Summarise',kind:'AI step (mock)',detail:'Uses a deterministic placeholder summary. No AI model or token billing is involved.'},{name:'Send review',kind:'Approval',detail:'Represents a human review handoff. This phase does not send notifications.'}];let selected=0;let runs=[];let sequence=0;let scenario='baseline';const scenarios={baseline:{label:'Normal operation',volume:100,retries:0,tokens:1200,latency:340},spike:{label:'Usage spike',volume:100,retries:2,tokens:3600,latency:790},validation:{label:'Invalid survey',volume:100,retries:0,tokens:0,latency:75}};function simulate(){const s=scenarios[scenario];sequence++;const failed=scenario==='validation';const record={id:'RUN-'+String(sequence).padStart(3,'0'),scenario,label:s.label,status:failed?'Failed':'Completed',volume:s.volume,retries:s.retries,tokens:s.tokens,latency:s.latency,estimatedCost:Number((s.tokens*0.000002).toFixed(4)),steps:steps.map((step,i)=>({name:step.name,status:failed&&i===1?'Failed':failed&&i>1?'Skipped':'Completed',durationMs:Math.round(s.latency/(i+1))}))};runs.unshift(record);if(runs.length>100)runs.length=100;logEvent('Workflow simulated',record.id+' · '+record.label+' · '+record.status);if(failed)createIncident('422',record.id);return record}function summary(){return runs.reduce((a,r)=>({count:a.count+1,success:a.success+(r.status==='Completed'?1:0),tokens:a.tokens+r.tokens,cost:a.cost+r.estimatedCost,retries:a.retries+r.retries}),{count:0,success:0,tokens:0,cost:0,retries:0})}
let requests=[],audit=[],requestSeq=0,eventSeq=0,clockDay=0;let publish={status:'Draft',version:1,requestedDay:null};let decisions=[];let decisionSeq=0;const demoStart='2026-11-12';function eventCategory(action){if(/incident|recovery/i.test(action))return 'Incidents';if(/access/i.test(action))return 'Access';if(/publish|draft/i.test(action))return 'Publishing';if(/workflow|editor/i.test(action))return 'Runs';if(/strategy/i.test(action))return 'Decisions';return 'Other'}
function eventReference(detail){const match=String(detail).match(/\b(?:INC|ACC|RUN|DEC)-\d{3,}\b/);return match?match[0]:null}
function logEvent(action,detail){audit.unshift({id:'EVT-'+String(++eventSeq).padStart(3,'0'),day:clockDay,action,detail,category:eventCategory(action),reference:eventReference(detail)});if(audit.length>200)audit.length=200}
function filteredAudit(category,query){const q=String(query||'').trim().toLowerCase().slice(0,100);return audit.filter(e=>(category==='All'||eventCategory(e.action)===category)&&(!q||[e.id,e.action,e.detail,eventReference(e.detail)||''].some(v=>String(v).toLowerCase().includes(q))))}
function activityView(category,query){const results=filteredAudit(category,query);return '<section class="workspace"><h3>Session audit timeline</h3><p>Local synthetic history, newest first. Records remain in this tab session only. They are not server-side security logs.</p><form id="activity-filter"><label>Event type <select name="category">'+['All','Runs','Incidents','Access','Publishing','Decisions','Other'].map(c=>'<option value="'+c+'"'+(category===c?' selected':'')+'>'+c+'</option>').join('')+'</select></label> <label>Search event or reference <input name="query" maxlength="100" value="'+escapeText(query)+'" placeholder="INC-001, RUN-001, approval"></label> <button class="button" type="submit">Filter events</button> <button type="button" id="clear-activity-filter">Clear</button></form><p role="status">'+results.length+' of '+audit.length+' events</p>'+(results.length?results.map(e=>{const ref=eventReference(e.detail);const destination=ref&&ref.startsWith('INC-')?'Incidents':ref&&ref.startsWith('ACC-')?'Access':ref&&ref.startsWith('RUN-')?'Monitoring':ref&&ref.startsWith('DEC-')?'Decisions':null;return '<article class="card" style="margin:10px 0"><strong>'+escapeText(e.id)+' · '+escapeText(e.action)+'</strong><p>Demo day '+e.day+' · '+escapeText(eventCategory(e.action))+'</p><p>'+escapeText(e.detail)+'</p>'+(ref?'<p>Reference: <strong>'+escapeText(ref)+'</strong></p>':'')+(destination?'<button data-activity-go="'+destination+'">Open '+destination+'</button>':'')+'</article>'}).join(''):'<p>No matching events. Change the filter or generate a synthetic action.</p>')+'</section>'}
function requestAccess(role,connector,days){if(!['Viewer','Space editor'].includes(role)||!['None','Slack: use only'].includes(connector)||![30,90].includes(days))return null;requestSeq++;const req={id:'ACC-'+String(requestSeq).padStart(3,'0'),role,connector,days,createdDay:clockDay,status:'Pending',approvedDay:null};requests.unshift(req);logEvent('Access requested',req.id+' · '+role+' · '+connector+' · '+days+' days');return req}function decideAccess(id,approved,reviewer,reason){const req=requests.find(r=>r.id===id);reviewer=String(reviewer||'').trim();reason=String(reason||'').trim();if(!req||req.status!=='Pending'||typeof approved!=='boolean'||!reviewer||reviewer.length>60||reason.length<8||reason.length>300)return false;req.status=approved?'Active':'Denied';req.approvedDay=approved?clockDay:null;req.reviewer=reviewer;req.reason=reason;logEvent(approved?'Access approved':'Access denied',req.id+' · '+req.role+' · '+req.connector+' · reviewer: '+reviewer+' · '+reason);return true}
function revokeAccess(id,reviewer,reason){const req=requests.find(r=>r.id===id);reviewer=String(reviewer||'').trim();reason=String(reason||'').trim();if(!req||req.status!=='Active'||!reviewer||reviewer.length>60||reason.length<8||reason.length>300)return false;req.status='Revoked';req.revokedDay=clockDay;logEvent('Access revoked',req.id+' · reviewer: '+reviewer+' · '+reason);return true}

ts=[];incidentSeq=0;decisions=[];decisionSeq=0;publish={status:'Draft',version:1,requestedDay:null};runs=[];sequence=0;scenario='baseline';selected=0;requests=[];audit=[];requestSeq=0;eventSeq=0;clockDay=0;return true}function escapeText(value){return String(value).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}

ired','Revoked'].includes(r.status)&&Number.isSafeInteger(r.createdDay)&&r.createdDay>=0&&(r.approvedDay===null||Number.isSafeInteger(r.approvedDay))&&(r.reviewer===undefined||typeof r.reviewer==='string'&&r.reviewer.length<=60)&&(r.reason===undefined||typeof r.reason==='string'&&r.reason.length<=300);const validEvent=e=>e&&typeof e.id==='string'&&/^EVT-\d{3,}$/.test(e.id)&&typeof e.action==='string'&&e.action.length<=100&&typeof e.detail==='string'&&e.detail.length<=500&&Number.isSafeInteger(e.day)&&e.day>=0;if(!s.runs.every(validRun)||!s.requests.every(validRequest)||!s.audit.every(validEvent)||!Array.isArray(s.decisions)||s.decisions.length>50||!Number.isSafeInteger(s.decisionSeq)||s.decisionSeq<0||!s.decisions.every(d=>d&&/^DEC-\d{3,}$/.test(d.id)&&['Build','Buy','Borrow'].includes(d.option)&&['Speed to delivery','Control and customization','Maintenance cost'].includes(d.reason)&&Number.isSafeInteger(d.day)&&d.day>=0&&(d.owner===undefined||typeof d.owner==='string'&&d.owner.length<=60&&typeof d.evidence==='string'&&d.evidence.length<=500&&typeof d.risk==='string'&&d.risk.length<=300)))return false;const validIncident=i=>i&&typeof i.id==='string'&&/^INC-\d{3,}$/.test(i.id)&&['401','422','429'].includes(i.code)&&['Open','Approved','Rejected','Recovered'].includes(i.status)&&typeof i.reviewer==='string'&&i.reviewer.length<=60&&typeof i.reason==='string'&&i.reason.length<=300&&Number.isSafeInteger(i.day)&&i.day>=0;if(!Array.isArray(s.incidents)||s.incidents.length>60||!s.incidents.every(validIncident)||!Number.isSafeInteger(s.incidentSeq)||s.incidentSeq<0)return false;runs=s.runs;sequence=s.sequence;scenario=s.scenario;requests=s.requests;audit=s.audit;requestSeq=s.requestSeq;eventSeq=s.eventSeq;clockDay=s.clockDay;decisions=s.decisions;decisionSeq=s.decisionSeq;incidents=s.incidents;incidentSeq=s.incidentSeq;publish={status:s.publish.status,version:s.publish.version,requestedDay:Number.isSafeInteger(s.publish.requestedDay)?s.publish.requestedDay:null};return true}c ns recorded yet.</p>')+'</section>';else if(name==='Access')body+='<div class="cards"><article class="card"><h3>Active grants</h3><h1>'+requests.filter(r=>r.status==='Active').length+'</h1><p>Approved and not expired</p></article><article class="card"><h3>Pending review</h3><h1>'+requests.filter(r=>r.status==='Pending').length+'</h1><p>Human decision required</p></article><article class="card"><h3>Simulated day</h3><h1>'+clockDay+'</h1><p>Relative to '+demoStart+'</p></article></div><section class="workspace"><h3>Request temporary access</h3><p>Grant only the permissions required for a synthetic marketing contractor. Every request requires an explicit reviewer decision.</p><form id="access-form"><label>Workspace role <select name="role"><option value="Viewer">Viewer</option><option value="Space editor">Space editor</option></select></label> <label>Connector scope <select name="connector"><option value="None">None</option><option value="Slack: use only">Slack: use only</option></select></label> <label>Duration <select name="days"><option value="30">30 days</option><option value="90">90 days</option></select></label> <button class="button" type="submit">Request approval</button></form><div style="margin-top:20px"><button class="button" id="advance">Advance demo by 30 days</button></div></section><section class="workspace" style="margin-top:16px"><h3>Access review queue</h3>'+(requests.length?requests.map(r=>'<div class="card" style="margin:10px 0"><strong>'+r.id+' · '+r.status+'</strong><p>'+escapeText(r.role)+' · '+escapeText(r.connector)+' · '+r.days+' days</p>'+(r.status==='Pending'?'<form data-review-access="'+r.id+'"><label>Reviewer<input name="reviewer" required maxlength="60"></label><label>Reason<input name="reason" required minlength="8" maxlength="300"></label><button class="button" type="submit" name="decision" value="approve">Approve</button> <button type="submit" name="decision" value="deny">Deny</button></form>' :r.status==='Active'?'<form data-revoke-access="'+r.id+'"><label>Reviewer<input name="reviewer" required maxlength="60"></label><label>Revocation reason<input name="reason" required minlength="8" maxlength="300"></label><button type="submit" class="button">Revoke access</button></form>':'')+'</div>').join(''):'<p>No access requests. Submit one above to start a review.</p>')+'</section>';else if(name==='Activity')body+=activityView(activityCategory,activityQuery);else if(name==='About')body+='<div class="cards"><article class="card"><h3>Shaik Arham Saquib</h3><p>Dublin-based MSc Computing (Data Analytics) graduate with 2.5+ years of enterprise BI operations experience at Hitachi Digital Services.</p></article><article class="card"><h3>What I bring</h3><p>SQL, Python, Oracle reporting systems, ETL monitoring, troubleshooting and evidence-led operational investigation.</p></article><article class="card"><h3>Why SYNES</h3><p>I built this independent project to learn how AI-assisted workflows can be designed, monitored and governed responsibly. I am interested in early-career opportunities at Tines.</p></article></div><p><a href="https://github.com/ShaikArham" target="_blank" rel="noopener noreferrer">GitHub portfolio ↗</a></p>';else if(name!=='Home')body+='<section class="workspace"><strong>Planned module</strong><p>This screen is a navigation placeholder. Data, controls and persistence are not implemented.</p></section>';body+='<div class="notice">SYNES is an independent portfolio prototype inspired by workflow-operations concepts. Not affiliated with Tines. All scenarios are synthetic.</div>';if(storageNotice)body+='<p role="status" class="notice">'+escapeText(storageNotice)+'</p>';view.innerHTML=body;if(name==='Activity'){const form=view.querySelector('#activity-filter');form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);activityCategory=String(d.get('category'));activityQuery=String(d.get('query')||'').slice(0,100);render('Activity')});view.querySelector('#clear-activity-filter').addEventListener('click',()=>{activityCategory='All';activityQuery='';render('Activity')});view.querySelectorAll('[data-activity-go]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.activityGo)))}if(name==='Monitoring')view.querySelectorAll('[data-go-incidents]').forEach(b=>b.addEventListener('click',()=>render('Incidents')));if(name==='Incidents'){view.querySelectorAll('[data-create-incident]').forEach(b=>b.addEventListener('click',()=>{createIncident(b.dataset.createIncident);render('Incidents')}));view.querySelectorAll('[data-review-incident]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const data=new FormData(form);if(reviewIncident(form.dataset.reviewIncident,e.submitter?.value==='approve',data.get('reviewer'),data.get('reason')))render('Incidents')}));view.querySelectorAll('[data-verify-incident]').forEach(b=>b.addEventListener('click',()=>{verifyIncident(b.dataset.verifyIncident);render('Incidents')}))}if(name==='Home'){view.querySelectorAll('[data-home-go]').forEach(b=>b.addEventListener('click',()=>render(b.dataset.homeGo)));view.querySelector('#reset-demo').addEventListener('click',()=>{if(window.confirm('Clear all synthetic runs, approvals and activity from this tab?')){resetDemo();clearSavedDemo();render('Home');view.querySelector('#reset-feedback').textContent='Demo reset. All session records cleared.'}})}if(name==='Workflows'){const publishActions=[['#request-publish',()=>requestPublish()],['#revise-draft',()=>reviseDraft()]];for(const [selector,action] of publishActions){const b=view.querySelector(selector);if(b)b.addEventListener('click',()=>{action();render('Workflows')})}const review=view.querySelector('#publish-review');if(review)review.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(review),submit=e.submitter,approved=submit?.value==='approve';if(decidePublish(approved,d.get('reviewer'),d.get('reason')))render('Workflows');else{const msg=document.createElement('p');msg.setAttribute('role','alert');msg.textContent='Enter a reviewer name and a reason of at least 8 characters.';review.append(msg)}});view.querySelectorAll('[data-step]').forEach(b=>b.addEventListener('click',()=>{selected=Number(b.dataset.step);render('Workflows')}));view.querySelector('#scenario').value=scenario;view.querySelector('#scenario').addEventListener('change',e=>scenario=e.target.value);view.querySelector('#run').addEventListener('click',()=>{simulate();render('Workflows')})}if(name==='Decisions'){view.querySelector('#decision-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);if(recordDecision(data.get('option'),data.get('reason'),data.get('evidence'),data.get('risk'),data.get('owner')))render('Decisions')})}if(name==='Access'){view.querySelector('#access-form').addEventListener('submit',e=>{e.preventDefault();const data=new FormData(e.currentTarget);requestAccess(data.get('role'),data.get('connector'),Number(data.get('days')));render('Access')});view.querySelector('#advance').addEventListener('click',()=>{advanceDay(30);render('Access')});view.querySelectorAll('[data-review-access]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);if(decideAccess(form.dataset.reviewAccess,e.submitter?.value==='approve',d.get('reviewer'),d.get('reason')))render('Access')}));view.querySelectorAll('[data-revoke-access]').forEach(form=>form.addEventListener('submit',e=>{e.preventDefault();const d=new FormData(form);if(revokeAccess(form.dataset.revokeAccess,d.get('reviewer'),d.get('reason')))render('Access')}))}side.classList.remove('open');menu.setAttribute('aria-expanded','false')}
document.querySelector('.skip-link').addEventListener('click',e=>{e.preventDefault();view.focus()});const syncLocation=()=>render(Object.keys(pages).find(n=>n.toLowerCase()===location.hash.slice(1))||'Home');window.addEventListener('hashchange',syncLocation);window.addEventListener('popstate',syncLocation);menu.addEventListener('click',()=>{const open=side.classList.toggle('open');menu.setAttribute('aria-expanded',String(open));if(open){const first=side.querySelector('a,button');if(first)first.focus()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&side.classList.contains('open')){side.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.focus()}else if(e.key==='Tab'&&side.classList.contains('open')&&matchMedia('(max-width:600px)').matches){const focusable=[...side.querySelectorAll('a[href],button:not([disabled])')];if(focusable.length){const first=focusable[0],last=focusable[focusable.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});window.addEventListener('resize',()=>{if(innerWidth>600&&side.classList.contains('open')){side.classList.remove('open');menu.setAttribute('aria-expanded','false')}});const recovered=restoreDemo();consumeEditorHandoff();if(!recovered){try{if(sessionStorage.getItem(STORE_KEY)){clearSavedDemo();storageNotice='Invalid or outdated saved demo data was cleared. A fresh session has started.'}}catch(_){}}render(Object.keys(pages).find(n=>n.toLowerCase()===location.hash.slice(1))||'Home');
</script></body></html>
