name: SYNES preview browser QA
on:
  push:
    branches: [work/hybrid-overview-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Browser simulation at four viewport widths
        run: node tests/preview-browser.cjs
      - name: Upload browser QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synes-preview-browser-qa
          path: artifacts/browser-qa/
          if-no-files-found: ignore
          retention-days: 14
