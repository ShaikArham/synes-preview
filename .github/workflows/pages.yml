name: Deploy SYNES preview to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview only
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static preview
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed public landing and workspace
        env:
          PREVIEW_BASE: https://shaikarham.github.io/synes-preview
        run: |
          python3 - <<'PY'
          import os, pathlib, time, urllib.request
          base = os.environ['PREVIEW_BASE'].rstrip('/')
          expected = pathlib.Path('lab.html').read_bytes()
          last = None
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(base + '/lab.html', timeout=20) as response:
                      actual = response.read()
                      assert response.status == 200
                  with urllib.request.urlopen(base + '/', timeout=20) as response:
                      landing = response.read().decode('utf-8')
                      assert response.status == 200
                  assert actual == expected, 'Published lab differs from checked-out release'
                  assert 'lab.html' in landing, 'Landing page lacks workspace link'
                  assert b'synes-demo-v1' in actual, 'Workspace session behavior absent'
                  assert b"typeof approved!=='boolean'" in actual, 'Security approval guard absent'
                  print('PASS public Pages HTTP smoke: landing and exact workspace parity')
                  break
              except Exception as exc:
                  last = exc
                  print(f'Published site not ready ({attempt + 1}/12): {exc}', flush=True)
                  time.sleep(10)
          else:
              raise SystemExit(f'FAIL public Pages HTTP smoke: {last}')
          PY
